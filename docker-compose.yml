services:
  api:
    build:
      context: ./backend
    image: alfa-credit/api:0.1.0
    container_name: alfa-credit-api
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      PIPELINE_STEP_DELAY: ${PIPELINE_STEP_DELAY:-3s}
      BANK_TOKEN: ${BANK_TOKEN:-demo-bank}
    volumes:
      - credit-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  credit-data:
