openapi: 3.0.3
info:
  title: Кредитный кабинет предпринимателя — API
  version: 0.2.0
  description: |
    REST API кредитного конвейера для МСБ. Клиентские методы требуют входа: `POST /api/v1/auth/login`
    ставит HttpOnly-cookie `sid` (SameSite=Strict, TTL 12 ч). Без сессии нельзя оформить, подписать или оплатить (401).
    Изменяющие запросы с чужого Origin отклоняются (403). Методы банка — заголовок `X-Bank-Token`.
    В проде — OIDC (Альфа ID) на API Gateway.

    **Идемпотентность.** `POST /applications` и `POST /applications/{id}/{submit,accept,sign,pay,cancel}` принимают
    заголовок `Idempotency-Key` (до 128 символов). Повтор с тем же ключом не выполняет действие второй раз и возвращает
    сохранённый ответ с заголовком `Idempotent-Replayed: true`. Тот же ключ с другим запросом → 422 `idempotency_key_reused`,
    запрос с этим ключом ещё выполняется → 409 `request_in_progress` + `Retry-After`. Ключи привязаны к клиенту и живут 24 ч.

    **Кэширование.** GET-ответы API отдаются с `ETag`; при `If-None-Match` и неизменных данных — `304 Not Modified` без тела.
    Справочники (`/products`, `/scoring/scale`) — `Cache-Control: public, max-age=300`.

    **Лимиты.** Не больше 20 запросов в секунду с IP (запас 60) → `429` + `Retry-After`. Таймаут запроса — 10 с (`503 timeout`).

    **Корреляция.** Каждый ответ содержит `X-Request-ID` (входящий принимается, если безопасного вида); он же — в теле ошибки
    (`error.request_id`), в логах, журнале аудита и заголовках событий Kafka.

    **События (Kafka).** Изменения заявок публикуются в топик `credit.applications.v1` (ключ — id заявки) через transactional
    outbox: `application.created`, `application.status_changed`, `loan.issued`, `loan.payment_received`; DLQ — `credit.applications.dlq.v1`.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
  - name: catalog
  - name: applications
  - name: bank
  - name: ops
paths:
  /healthz:
    get: { tags: [ops], summary: Liveness, responses: { '200': { description: OK } } }
  /readyz:
    get: { tags: [ops], summary: 'Readiness: PostgreSQL и Kafka, с причиной отказа', responses: { '200': { description: OK }, '503': { description: Not ready } } }

  /api/v1/products:
    get:
      tags: [catalog]
      summary: Каталог кредитных продуктов
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } } }
  /api/v1/security-rules:
    get:
      tags: [catalog]
      summary: Правила обеспечения для полной анкеты — с какой суммы нужен залог или поручитель, виды залога и дисконты
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  required_from: { type: integer, example: 5000000 }
                  kinds: { type: array, items: { type: object, properties: { type: { type: string }, name: { type: string }, discount: { type: number } } } }
                  premises: { type: array, items: { type: object, properties: { type: { type: string }, name: { type: string } } } }
  /api/v1/scoring/scale:
    get:
      tags: [catalog]
      summary: Шкала балльной модели (пороги решения)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { base: { type: integer, example: 600 }, reject_below: { type: integer, example: 500 }, approve_from: { type: integer, example: 650 }, max_dti_percent: { type: integer, example: 50 } }
  /api/v1/calc:
    post:
      tags: [catalog]
      summary: Расчёт аннуитетного платежа
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CalcResult' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /api/v1/companies/{inn}:
    get:
      tags: [catalog]
      summary: Поиск компании по ИНН (ЕГРЮЛ/ЕГРИП, мок)
      security: [{ client: [] }]
      parameters: [{ name: inn, in: path, required: true, schema: { type: string, pattern: '^\d{10}(\d{2})?$' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/v1/applications:
    post:
      tags: [applications]
      summary: Создать черновик анкеты сразу из калькулятора
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      security: [{ client: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '422': { $ref: '#/components/responses/Validation' }
    get:
      tags: [applications]
      summary: Заявки текущего клиента (без limit — все; с limit/offset — постранично)
      security: [{ client: [] }]
      parameters:
        - $ref: '#/components/parameters/Status'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          headers: { X-Total-Count: { $ref: '#/components/headers/TotalCount' }, Link: { $ref: '#/components/headers/Link' }, ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Application' } } } }
        '304': { description: Не изменилось (If-None-Match) }
        '422': { $ref: '#/components/responses/Validation' }
  /api/v1/applications/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [applications]
      summary: Заявка (используется для поллинга прогресса)
      security: [{ client: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [applications]
      summary: Автосохранение анкеты (частичное обновление). При смене ИНН подтягивается компания.
      security: [{ client: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DraftPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/v1/applications/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [applications]
      summary: 'Отправить: быстрая анкета (draft|need_info → submitted) или полная (full_form|need_info → verification)'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      security: [{ client: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/v1/applications/{id}/accept:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [applications]
      summary: 'Принять решение: предварительное → full_form (открывается полная анкета), окончательное → signing'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      security: [{ client: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/applications/{id}/sign:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [applications]
      summary: Подписать ПЭП и получить средства (симуляция, → issued)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      security: [{ client: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { confirm: { type: boolean } }, required: [confirm] } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/applications/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [applications]
      summary: Отменить заявку
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      security: [{ client: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Вход по телефону и паролю (5 неудачных попыток → блокировка на минуту)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, password], properties: { phone: { type: string, example: '+7 900 000-00-01' }, password: { type: string, example: demo1234 } } } } } }
      responses:
        '200': { description: OK, headers: { Set-Cookie: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Регистрация по ИНН — компания и реквизиты подтягиваются из реестра
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, password, full_name, inn], properties: { phone: { type: string }, password: { type: string, minLength: 8 }, full_name: { type: string }, inn: { type: string }, email: { type: string } } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /api/v1/auth/logout:
    post: { tags: [auth], summary: Выход, responses: { '204': { description: No Content } } }
  /api/v1/me:
    get:
      tags: [auth]
      summary: Профиль — клиента (компания, реквизиты, баланс) или сотрудника банка (служебная карточка и права)
      security: [{ client: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [auth]
      summary: Изменить почту или должность (сотруднику банка должность менять нельзя — 422)
      security: [{ client: [] }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { email: { type: string }, position: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
  /api/v1/applications/{id}/pay:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [applications]
      summary: Оплатить очередной платёж по выданному кредиту со своего расчётного счёта
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      security: [{ client: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { description: Недостаточно средств, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/bank/applications:
    get:
      tags: [bank]
      summary: Заявки конвейера (кабинет сотрудника) — поиск, фильтр, страницы
      description: 'Сессия сотрудника банка (роль employee, право applications.view) или служебный X-Bank-Token. Клиенту — 403.'
      security: [{ client: [] }, { bank: [] }]
      parameters:
        - { name: q, in: query, description: 'номер заявки, ИНН или название компании', schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Status'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          headers: { X-Total-Count: { $ref: '#/components/headers/TotalCount' }, Link: { $ref: '#/components/headers/Link' } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Application' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'Вошёл клиент или у сотрудника нет права', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/bank/applications/{id}/audit:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [bank]
      summary: Журнал аудита по заявке (режим PostgreSQL)
      description: 'Право audit.view.'
      security: [{ client: [] }, { bank: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at: { type: string, format: date-time }
                    actor: { type: string }
                    action: { type: string, example: loan.pay }
                    entity: { type: string }
                    entity_id: { type: string }
                    outcome: { type: string, enum: [ok, denied, error] }
                    request_id: { type: string }
                    details: { type: object }
        '501': { description: Хранилище без журнала аудита (файловый режим) }
  /api/v1/bank/platform:
    get:
      tags: [bank]
      summary: Состояние платформы — хранилище, шина событий, очередь outbox, кэши
      description: 'Право platform.view.'
      security: [{ client: [] }, { bank: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  storage: { type: string, enum: [postgres, file] }
                  bus: { type: string, enum: [kafka, memory] }
                  role: { type: string, enum: [all, api, worker] }
                  outbox_pending: { type: integer }
                  events_published: { type: integer }
                  caches: { type: array, items: { type: object, properties: { name: { type: string }, hits: { type: integer }, misses: { type: integer }, size: { type: integer }, hit_rate: { type: number } } } }

components:
  securitySchemes:
    client: { type: apiKey, in: cookie, name: sid }
    bank: { type: apiKey, in: header, name: X-Bank-Token }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, description: 'ключ идемпотентности (UUID); повтор вернёт сохранённый ответ', schema: { type: string, maxLength: 128 } }
    Status: { name: status, in: query, description: 'статусы через запятую', schema: { type: string, example: 'approved,counter_offer' } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  headers:
    TotalCount: { description: Общее число записей по фильтру, schema: { type: integer } }
    Link: { description: 'Соседние страницы (RFC 8288): rel="next", rel="prev"', schema: { type: string } }
    ETag: { description: Версия ответа для If-None-Match, schema: { type: string } }
  responses:
    Error:
      description: Ошибка
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Validation:
      description: Ошибка валидации (field — путь к полю анкеты)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [client, employee], description: 'client — представитель бизнеса, employee — сотрудник банка' }
        phone: { type: string }
        full_name: { type: string }
        position: { type: string }
        email: { type: string }
        company: { $ref: '#/components/schemas/Company' }
        requisites:
          type: object
          properties: { account: { type: string }, bank_name: { type: string }, bik: { type: string }, corr_account: { type: string }, kpp: { type: string } }
        balance: { type: integer, description: 'остаток на расчётном счёте, ₽' }
        employee:
          type: object
          description: 'только у сотрудника банка'
          properties:
            personnel_no: { type: string, description: табельный номер }
            department: { type: string }
            branch: { type: string }
            permissions: { type: array, items: { type: string, enum: [applications.view, audit.view, platform.view] } }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [validation, not_found, company_not_found, invalid_transition, unauthorized, invalid_credentials, too_many_attempts, insufficient_funds, forbidden, bad_request, method_not_allowed, rate_limited, idempotency_key_reused, request_in_progress, timeout, internal] }
            message: { type: string }
            field: { type: string }
            request_id: { type: string, description: 'совпадает с X-Request-ID — по нему находятся все логи запроса' }
    Status:
      type: string
      description: |
        Двухуровневая анкета: draft → submitted → data_check → scoring → approved|counter_offer (предварительно, decision.final=false)
        → full_form (клиент заполняет полную анкету) → verification → approved (decision.final=true) | need_info → signing → issued.
        Овердрафт (product.express) — одноуровневый: решение по быстрой анкете сразу окончательное.
      enum: [draft, submitted, data_check, scoring, approved, counter_offer, full_form, verification, need_info, rejected, signing, issued, closed, cancelled]
    Product:
      type: object
      properties:
        id: { type: string, example: business-dev }
        name: { type: string }
        description: { type: string }
        rate: { type: number, example: 19.9 }
        min_amount: { type: integer }
        max_amount: { type: integer }
        min_term: { type: integer }
        max_term: { type: integer }
        default_amount: { type: integer }
        default_term: { type: integer }
        default_payment: { type: integer, description: 'платёж при сумме и сроке по умолчанию (считает сервер)' }
        purposes: { type: array, items: { type: string } }
        badge: { type: string }
        express: { type: boolean, description: 'одноуровневый продукт: без полной анкеты' }
    CreateInput:
      type: object
      required: [product_id]
      properties:
        product_id: { type: string, example: business-dev }
        amount: { type: integer, example: 3000000 }
        term_months: { type: integer, example: 24 }
    CalcResult:
      $ref: '#/components/schemas/Quote'
    Quote:
      type: object
      description: Единственный источник расчёта платежа (Go domain.Quote). Клиент не считает деньги сам.
      properties:
        amount: { type: integer }
        term_months: { type: integer }
        rate: { type: number }
        monthly_payment: { type: integer }
        total: { type: integer }
        overpayment: { type: integer }
    Company:
      type: object
      properties:
        inn: { type: string }
        ogrn: { type: string }
        type: { type: string, enum: [ООО, ИП] }
        name: { type: string }
        okved: { type: string }
        okved_name: { type: string }
        address: { type: string }
        director: { type: string }
        reg_date: { type: string, format: date }
        status: { type: string, enum: [active, liquidated] }
        revenue_last_year: { type: integer }
        source: { type: string }
    Financials:
      type: object
      properties:
        annual_revenue: { type: integer }
        monthly_obligations: { type: integer }
        employees: { type: integer }
    Contact:
      type: object
      properties:
        full_name: { type: string }
        position: { type: string }
        phone: { type: string }
        email: { type: string }
    DraftPatch:
      type: object
      properties:
        product_id: { type: string }
        amount: { type: integer }
        term_months: { type: integer }
        purpose: { type: string }
        inn: { type: string }
        financials: { $ref: '#/components/schemas/Financials' }
        contact: { $ref: '#/components/schemas/Contact' }
        consent: { type: boolean }
        full_form: { $ref: '#/components/schemas/FullForm' }
      description: 'До предварительного решения правится быстрая анкета; после — только full_form (иначе 422).'
    FullForm:
      type: object
      description: Полная анкета (уровень 2) — открывается после принятия предварительных условий
      properties:
        employees: { type: integer, description: 'сотрудников, включая руководителя' }
        premises: { type: string, enum: [own, rent, none] }
        purpose_details: { type: string, description: 'на что пойдут деньги, от 20 символов' }
        collateral:
          type: object
          properties:
            type: { type: string, enum: [none, realty, vehicle, equipment, deposit] }
            value: { type: integer, description: 'оценочная стоимость, ₽' }
            description: { type: string }
        guarantor: { type: object, properties: { full_name: { type: string }, inn: { type: string, description: 'ИНН физлица, 12 цифр' } } }
        statements_consent: { type: boolean, description: 'согласие на запрос выписок и отчётности' }
    Check:
      type: object
      properties:
        code: { type: string, enum: [registry, bki, revenue, scoring, full_form, collateral, guarantor] }
        name: { type: string }
        result: { type: string, enum: [ok, warn, fail] }
        details: { type: string }
    Decision:
      type: object
      properties:
        type: { type: string, enum: [approved, counter_offer, need_info, rejected] }
        amount: { type: integer }
        term_months: { type: integer }
        rate: { type: number }
        monthly_payment: { type: integer }
        total: { type: integer }
        overpayment: { type: integer }
        requested: { $ref: '#/components/schemas/Quote' }
        reasons: { type: array, items: { type: string }, description: 'объяснение простыми словами на данных анкеты' }
        advice: { type: array, items: { type: string }, description: 'что можно сделать (отказ, уточнение)' }
        final: { type: boolean, description: 'false — предварительное решение по быстрой анкете, дальше полная анкета' }
    Installment:
      type: object
      properties: { n: { type: integer }, payment: { type: integer }, principal: { type: integer }, interest: { type: integer }, rest: { type: integer } }
    Event:
      type: object
      properties:
        status: { $ref: '#/components/schemas/Status' }
        at: { type: string, format: date-time }
        actor: { type: string, enum: [client, system, bank] }
        comment: { type: string }
    Application:
      type: object
      properties:
        id: { type: string }
        number: { type: string, example: КР-000001 }
        product_id: { type: string }
        amount: { type: integer }
        term_months: { type: integer }
        purpose: { type: string }
        inn: { type: string }
        company: { $ref: '#/components/schemas/Company' }
        financials: { $ref: '#/components/schemas/Financials' }
        contact: { $ref: '#/components/schemas/Contact' }
        consent: { type: boolean }
        level: { type: integer, enum: [1, 2], description: 'уровень анкеты: 1 — быстрая, 2 — полная' }
        full_form: { $ref: '#/components/schemas/FullForm' }
        preliminary: { $ref: '#/components/schemas/Decision' }
        status: { $ref: '#/components/schemas/Status' }
        bureau:
          type: object
          properties: { score: { type: integer }, active_loans: { type: integer }, has_overdue: { type: boolean }, max_overdue_days: { type: integer }, source: { type: string } }
        checks: { type: array, items: { $ref: '#/components/schemas/Check' } }
        score: { type: integer }
        factors:
          type: array
          description: из чего сложился балл — фактор, баллы (+/−) и объяснение простыми словами
          items: { type: object, properties: { name: { type: string }, impact: { type: integer }, explain: { type: string } } }
        decision: { $ref: '#/components/schemas/Decision' }
        history: { type: array, items: { $ref: '#/components/schemas/Event' } }
        quote: { $ref: '#/components/schemas/Quote' }
        schedule: { type: array, items: { $ref: '#/components/schemas/Installment' }, description: 'график для выданного кредита' }
        next_payment: { type: integer, description: 'сумма очередного платежа' }
        payments: { type: array, items: { type: object, properties: { n: { type: integer }, at: { type: string, format: date-time }, amount: { type: integer } } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status_changed_at: { type: string, format: date-time }
